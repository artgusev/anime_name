# Пример: добавьте сервис animename в compose рядом с prowlarr и sonarr.
# Контейнер должен видеть Prowlarr по имени сервиса (общая сеть compose).
services:
  animename:
    build: .
    container_name: animename
    environment:
      UPSTREAM_URL: http://prowlarr:9696
      OVERRIDES_FILE: /config/overrides.toml   # уберите, если файл не нужен
      PACK_STYLE: season                        # season | range
      MAX_EPISODES: "100"
      CACHE_TTL: "600"                          # секунды; 0 выключает кэш ответов
      QUERY_LANGUAGES: ru,en                    # запросы на других языках сразу получают пустой RSS; any выключает
      # QUERY_ALLOW: "Chevalier"                # исключения: такие запросы идут в Prowlarr всегда
      # QUERY_SKIP: "Ataque|Attaque|attacco"    # исключения: такие запросы не идут никогда
      LOG_LEVEL: INFO                           # DEBUG покажет и нераспознанные заголовки
    volumes:
      - ./config:/config:ro
    # Порт наружу нужен только для отладки: Sonarr ходит по внутренней сети.
    # ports:
    #   - "8080:8080"
    restart: unless-stopped
