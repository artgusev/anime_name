[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animename"
version = "0.1.0"
description = "Torznab-прокси между Prowlarr и Sonarr: переписывает заголовки RuTracker в формат, который понимает Sonarr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
animename = "animename.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
