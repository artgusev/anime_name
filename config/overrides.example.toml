# Правила для отдельных тайтлов. Файл подключается через OVERRIDES_FILE.
# match — регулярное выражение (без учёта регистра), ищется в латинском названии
# после очистки ("Shingeki no Kyojin", а не весь заголовок RuTracker).
# Срабатывает первое подходящее правило.

# Длинные онгоинги с одним "TV" на сотни серий не ложатся на сезоны TVDB — не переписывать.
[[override]]
match = "^One Piece$"
skip = true

# Принудительное название, если в Sonarr у сериала нет нужного алиаса.
[[override]]
match = "^Shingeki no Kyojin"
title = "Attack on Titan"

# Принудительный номер сезона, если нумерация [TV-N] на RuTracker не совпадает с TVDB.
# [[override]]
# match = "^Boku no Hero Academia"
# season = 7
